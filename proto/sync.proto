syntax = "proto3";

package im.sync;

import "conversation.proto";
import "file.proto";
import "message.proto";

message SyncRequest {
  uint64 global_cursor = 1;
  uint32 limit = 2;
  string conversation_id = 3;
  uint64 conversation_cursor = 4;
}

// A device confirms only the continuous prefix committed to its local cache.
message SyncApplied {
  uint64 global_cursor = 1;
}

message DeliveryUpdated {
  string event_id = 1;
  string conversation_id = 2;
  string message_id = 3;
  string user_id = 4;
  string status = 5;
  int64 sent_at_ms = 6;
  int64 delivered_at_ms = 7;
  int64 read_at_ms = 8;
  int64 failed_at_ms = 9;
  string failure_reason = 10;
}

// Absolute display count for the recipients recorded when the message was sent.
message ReadCountUpdated {
  string event_id = 1;
  string conversation_id = 2;
  string message_id = 3;
  uint32 unread_count = 4;
}

message SyncEvent {
  string event_id = 1;
  uint64 global_seq = 2;
  oneof body {
    im.message.Message message = 10;
    im.message.Recall recall = 11;
    im.message.Receipt receipt = 12;
    im.conversation.ConversationUpdated conversation_updated = 13;
    im.file.FileUpdated file_updated = 14;
    DeliveryUpdated delivery_updated = 15;
    ReadCountUpdated read_count_updated = 16;
  }
}

message SyncResponse {
  uint64 new_global_cursor = 1;
  repeated SyncEvent events = 2;
  bool has_more = 3;
}
